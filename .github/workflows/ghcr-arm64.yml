name: GHCR arm64

on:
  workflow_dispatch:
  push:
    branches:
      - udp0rtt

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download geo databases
        run: |
          set -eu
          mkdir -p docker/geo
          base=https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest
          for name in geoip.metadb geosite.dat geoip.dat; do
            curl -fL --retry 10 --retry-all-errors --retry-delay 3 \
              -o "docker/geo/$name" "$base/$name"
          done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/seemsfishy/mihomo:v1.19.33-udp0rtt
            ghcr.io/seemsfishy/mihomo:latest
          build-args: |
            VERSION=v1.19.33-udp0rtt
          labels: |
            org.opencontainers.image.source=https://github.com/SeemsFishy/mihomo
